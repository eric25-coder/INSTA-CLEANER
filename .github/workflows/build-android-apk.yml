name: Build Android APK & AAB (Insta Cleaner)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Android Build Variant (debug, release, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-android:
    name: Build Native Android APK & Web Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Check out repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up the required JDK version (Java 21 required by Capacitor 8 & AGP 8.13.0)
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Set up Android SDK (explicitly override default 'tools platform-tools' to avoid obsolete 'tools' package)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools'

      # 4. Install required Android SDK packages matching android/variables.gradle (compileSdkVersion = 36)
      - name: Install Required Android SDK Packages
        run: |
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_DIR"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_DIR"
          if [ -x "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(which sdkmanager)
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_DIR" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_DIR" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Accept Android SDK licences
      - name: Accept Android SDK Licenses
        run: |
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -x "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(which sdkmanager)
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_DIR" --licenses > /dev/null || true

      # 6. Set up Node.js
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # 7. Install project dependencies, build web bundle, and sync Capacitor Android
      - name: Install Project Dependencies & Sync Capacitor Android
        working-directory: .
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # 8. Set up Gradle & Android project configuration
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK Path & Gradle Wrapper Permissions
        working-directory: .
        run: |
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_SDK_DIR" > android/local.properties
          chmod +x android/gradlew
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ] && ! grep -q "com.instagram.android" "$MANIFEST_FILE"; then
            sed -i 's|</manifest>|  <queries>\n    <package android:name="com.instagram.android" />\n    <intent>\n      <action android:name="android.intent.action.VIEW" />\n      <data android:scheme="instagram" />\n    </intent>\n  </queries>\n</manifest>|g' "$MANIFEST_FILE"
          fi

      # 9. Build the Android APK & AAB
      - name: Build Android Debug & Release APK
        working-directory: android
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Sign Release APK (Optional - Uses GitHub Secrets if Configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Signing Release APK with provided keystore secret..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
            ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            BUILD_TOOLS_DIR="$ANDROID_SDK_DIR/build-tools/$(ls "$ANDROID_SDK_DIR/build-tools" | sort -V | tail -n 1)"
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
              app/build/outputs/apk/release/app-release-unsigned.apk \
              app/build/outputs/apk/release/Insta-Cleaner-Release-Aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release-key.jks \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out app/build/outputs/apk/release/Insta-Cleaner-Release-Signed.apk \
              app/build/outputs/apk/release/Insta-Cleaner-Release-Aligned.apk
            rm -f release-key.jks
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; keeping debug APK and unsigned release artifacts."
          fi

      - name: Prepare Named APK & AAB Artifacts
        working-directory: .
        run: |
          mkdir -p artifacts/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/apk/Insta-Cleaner-v3.0.0-debug.apk
          if [ -f "android/app/build/outputs/apk/release/Insta-Cleaner-Release-Signed.apk" ]; then
            cp android/app/build/outputs/apk/release/Insta-Cleaner-Release-Signed.apk artifacts/apk/Insta-Cleaner-v3.0.0-release-signed.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/apk/Insta-Cleaner-v3.0.0-release-unsigned.apk
          fi
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab artifacts/apk/Insta-Cleaner-v3.0.0-release.aab
          fi

      # 10. Upload the generated APK as a GitHub Actions artifact
      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Insta-Cleaner-Android-Builds
          path: artifacts/apk/*
          retention-days: 30

      - name: Publish APK to GitHub Releases (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/apk/*
          generate_release_notes: true
