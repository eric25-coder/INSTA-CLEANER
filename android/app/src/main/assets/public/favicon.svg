<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Primary vibrant sunset-to-violet squircle gradient -->
    <linearGradient id="ic_bg" x1="12" y1="116" x2="116" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="28%" stop-color="#F43F5E" />
      <stop offset="62%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Top-left glass sheen -->
    <linearGradient id="ic_sheen" x1="16" y1="12" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Badge emerald-to-cyan gradient -->
    <linearGradient id="ic_badge" x1="76" y1="76" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="ic_shadow" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B1020" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#ic_bg)" />
  <rect x="9.5" y="9.5" width="109" height="109" rx="28.5" stroke="url(#ic_sheen)" stroke-width="3" />

  <!-- Inner Camera Frame -->
  <g filter="url(#ic_shadow)">
    <rect x="28" y="28" width="72" height="72" rx="20" stroke="#FFFFFF" stroke-width="6.5" fill="#0B1020" fill-opacity="0.18" />
    <!-- Center Lens Ring -->
    <circle cx="64" cy="64" r="18" stroke="#FFFFFF" stroke-width="6.5" fill="none" />
    <!-- Top-Right Flash Sparkle Star -->
    <path d="M84 37.5L85.8 42.2L90.5 44L85.8 45.8L84 50.5L82.2 45.8L77.5 44L82.2 42.2L84 37.5Z" fill="#FFFFFF" />
  </g>

  <!-- Bottom-Right Cleaner Checkmark Shield Badge -->
  <circle cx="94" cy="94" r="22" fill="#0B1020" />
  <circle cx="94" cy="94" r="18.5" fill="url(#ic_badge)" />
  <path d="M86.5 94.2L91.5 99.2L102 88.7" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
